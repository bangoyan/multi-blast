<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="clayBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#242B38" />
      <stop offset="60%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0A0C10" />
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8F85D" />
      <stop offset="100%" stop-color="#8CE800" />
    </linearGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D8F85D" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <g id="container" filter="url(#clayShadow)">
    <rect x="36" y="36" width="440" height="440" rx="120" fill="url(#clayBody)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" />
  </g>

  <!-- Omnichannel Signal Broadcast (Claymorphic concentric arcs + blast core) -->
  <g id="icon">
    <!-- Outer Broadcast Arc (Cyan) -->
    <path d="M 120 200 A 160 160 0 0 1 392 200" fill="none" stroke="#00D4D6" stroke-width="24" stroke-linecap="round" opacity="0.85" />
    <!-- Middle Broadcast Arc (Purple) -->
    <path d="M 160 236 A 110 110 0 0 1 352 236" fill="none" stroke="#A78BFA" stroke-width="24" stroke-linecap="round" opacity="0.9" />
    <!-- Inner Broadcast Arc (Lime) -->
    <path d="M 204 274 A 60 60 0 0 1 308 274" fill="none" stroke="url(#neonGlow)" stroke-width="24" stroke-linecap="round" />

    <!-- Central Signal Emitter Node -->
    <circle cx="256" cy="336" r="38" fill="url(#neonGlow)" />
    <circle cx="256" cy="336" r="16" fill="#141820" />

    <!-- 4 Channel Pulse Beams downward -->
    <line x1="256" y1="374" x2="256" y2="416" stroke="#D8F85D" stroke-width="8" stroke-linecap="round" />
    <line x1="220" y1="364" x2="180" y2="400" stroke="#00D4D6" stroke-width="8" stroke-linecap="round" />
    <line x1="292" y1="364" x2="332" y2="400" stroke="#FF4D82" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
