<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E26" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>
    <linearGradient id="beamGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8F85D" />
      <stop offset="100%" stop-color="#00D4D6" />
    </linearGradient>
    <linearGradient id="beamGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF" />
      <stop offset="100%" stop-color="#D8F85D" />
    </linearGradient>
    <filter id="clayShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle Container for App Stores & Meta -->
  <g id="container" filter="url(#clayShadow)">
    <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" />
  </g>

  <!-- Dynamic Geometric 'M' Blast Beam Icon -->
  <g id="icon">
    <!-- Left Pillar Blast -->
    <path d="M 120 376 L 120 180 C 120 150, 150 136, 172 156 L 256 236 L 256 376 Z" fill="#D8F85D" />

    <!-- Central Overlap Angle -->
    <path d="M 256 236 L 340 156 C 362 136, 392 150, 392 180 L 392 376 L 328 376 L 328 236 L 256 304 L 184 236 L 184 376 L 120 376 Z" fill="url(#beamGrad1)" opacity="0.95" />

    <!-- Right Dynamic Energy Flare -->
    <path d="M 256 304 L 328 236 L 392 296 L 392 376 Z" fill="url(#beamGrad2)" opacity="0.8" />

    <!-- Energy Satellite Nodes (4 Channels) -->
    <circle cx="120" cy="136" r="14" fill="#D8F85D" />
    <circle cx="256" cy="112" r="16" fill="#00D4D6" />
    <circle cx="392" cy="136" r="14" fill="#7C4DFF" />
    <circle cx="256" cy="392" r="10" fill="#FFA048" />
  </g>
</svg>
