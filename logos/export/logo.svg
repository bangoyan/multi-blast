<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8FF82" />
      <stop offset="100%" stop-color="#B6EC1A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container -->
  <g id="container" filter="url(#glow)">
    <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#darkBg)" stroke="#2C3240" stroke-width="3" />
  </g>

  <!-- Hexagonal Blast Energy / Starburst Symbol -->
  <g id="icon">
    <!-- Channel Directional Arrows / Blast Wings -->
    <!-- Top (YouTube/Video) -->
    <path d="M 256 100 L 296 172 L 256 160 L 216 172 Z" fill="#FF4343" />
    <!-- Right (Instagram/Meta) -->
    <path d="M 412 256 L 340 296 L 352 256 L 340 216 Z" fill="#FF44A8" />
    <!-- Bottom (TikTok) -->
    <path d="M 256 412 L 216 340 L 256 352 L 296 340 Z" fill="#00F2FE" />
    <!-- Left (Facebook) -->
    <path d="M 100 256 L 172 216 L 160 256 L 172 296 Z" fill="#1877F2" />

    <!-- Central Dynamic Diamond Core (MultiBlast Primary) -->
    <polygon points="256,156 356,256 256,356 156,256" fill="url(#limeGrad)" />

    <!-- Inner Core Cutout 'M' shape -->
    <polygon points="256,204 308,256 288,256 256,224 224,256 204,256" fill="#090B0E" />
    <circle cx="256" cy="276" r="22" fill="#090B0E" />
    <circle cx="256" cy="276" r="12" fill="url(#limeGrad)" />
  </g>
</svg>
